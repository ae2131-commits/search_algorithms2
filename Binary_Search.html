<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Binary Search Visualizer - With Steps Counter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 950px;
            width: 100%;
        }

        h2 {
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .input-section {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            width: 120px;
            text-align: center;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 15px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            flex-wrap: wrap;
        }

        .stats-bar span {
            color: #38bdf8;
            font-weight: bold;
        }

        .array-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
            background: #0f172a;
            border-radius: 10px;
        }

        .cell {
            width: 50px;
            height: 50px;
            background: #334155;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .cell span.index {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* حالات الخلية الخاصة بالبحث الثنائي */
        .cell.out-of-range {
            background: #1e293b;
            color: #475569;
            opacity: 0.3;
        }

        .cell.mid {
            background: #f59e0b;
            color: #000;
            transform: scale(1.1);
            border-color: #fbbf24;
        }

        .cell.found {
            background: #10b981;
            color: #fff;
            transform: scale(1.15);
            border-color: #34d399;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #475569;
            color: white;
        }

        .btn-secondary:hover {
            background: #334155;
        }

        .btn-accent {
            background: #10b981;
            color: white;
        }

        .btn-accent:hover {
            background: #059669;
        }

        .status {
            font-size: 17px;
            margin-top: 15px;
            min-height: 30px;
            color: #e2e8f0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>أداة بحث ثنائي تفاعلية (Binary Search) - عداد الخطوات</h2>

        <div class="input-section">
            <label for="targetInput">ابحث عن الرقم:</label>
            <input type="number" id="targetInput" value="45">
            <button class="btn-accent" onclick="startNewSearch()">بدء بحث جديد</button>
            <button class="btn-secondary" onclick="generateRandomArray()">توليد مصفوفة جديدة 🎲</button>
        </div>

        <div class="stats-bar">
            <div>عدد الخطوات: <span id="steps-count">0</span></div>
            <div>البداية (Left): <span id="left-val">-</span></div>
            <div>النهاية (Right): <span id="right-val">-</span></div>
            <div>المنتصف (Mid): <span id="mid-val">-</span></div>
        </div>

        <div class="array-container" id="array-box"></div>

        <div class="controls">
            <button class="btn-secondary" onclick="resetSearch()">إعادة تعيين</button>
            <button class="btn-primary" onclick="nextStep()">الخطوة التالية ➡️</button>
        </div>

        <div class="status" id="status-text">اختر رقماً واضغط على "بدء بحث جديد"... (ملحوظة: المصفوفة مرتبة تلقائياً)
        </div>
    </div>

    <script>
        let array = [];
        let target = 45;
        let left = 0;
        let right = 0;
        let mid = -1;
        let stepsCount = 0;
        let searchState = 'idle'; // idle, searching, found, not_found

        function generateRandomArray() {
            array = [];
            for (let i = 0; i < 15; i++) {
                array.push(Math.floor(Math.random() * 90) + 10);
            }
            // البحث الثنائي يتطلب مصفوفة مرتبة (Sorted Array)
            array.sort((a, b) => a - b);
            resetSearch();
        }

        function renderArray() {
            const box = document.getElementById('array-box');
            box.innerHTML = '';

            array.forEach((val, idx) => {
                let className = 'cell';

                if (searchState !== 'idle') {
                    // إذا كان العنصر خارج نطاق البحث الحالي (Left إلى Right)
                    if (idx < left || idx > right) {
                        className += ' out-of-range';
                    }
                }

                if (idx === mid && searchState === 'searching') {
                    className += ' mid';
                } else if (idx === mid && searchState === 'found') {
                    className += ' found';
                }

                box.innerHTML += `
                    <div class="${className}">
                        ${val}
                        <span class="index">[${idx}]</span>
                    </div>
                `;
            });

            document.getElementById('steps-count').innerText = stepsCount;
            document.getElementById('left-val').innerText = (searchState === 'idle') ? '-' : left;
            document.getElementById('right-val').innerText = (searchState === 'idle') ? '-' : right;
            document.getElementById('mid-val').innerText = (mid === -1) ? '-' : mid;
        }

        function startNewSearch() {
            const inputVal = document.getElementById('targetInput').value;
            if (inputVal === '') {
                alert('الرجاء إدخال رقم للبحث عنه!');
                return;
            }
            target = parseInt(inputVal);
            left = 0;
            right = array.length - 1;
            mid = -1;
            stepsCount = 0;
            searchState = 'searching';
            renderArray();
            document.getElementById('status-text').innerHTML = `جاهز للبحث عن الرقم <span style="color:#38bdf8">${target}</span>. اضغط "الخطوة التالية"`;
        }

        function resetSearch() {
            left = 0;
            right = array.length - 1;
            mid = -1;
            stepsCount = 0;
            searchState = 'idle';
            renderArray();
            document.getElementById('status-text').innerText = `تم إعادة تعيين البحث.`;
        }

        function nextStep() {
            const statusEl = document.getElementById('status-text');

            if (searchState === 'idle') {
                startNewSearch();
                return;
            }

            if (searchState === 'found' || searchState === 'not_found') {
                return;
            }

            // إذا تجاوزت البداية النهاية ولم نجد الرقم
            if (left > right) {
                searchState = 'not_found';
                mid = -1;
                statusEl.innerHTML = `❌ الرقم <span style="color:#ef4444">${target}</span> غير موجود في المصفوفة بعد <span style="color:#38bdf8">${stepsCount}</span> خطوات.`;
                renderArray();
                return;
            }

            // حساب المنتصف الجديد
            stepsCount++;
            mid = Math.floor((left + right) / 2);

            if (array[mid] === target) {
                searchState = 'found';
                statusEl.innerHTML = `🎉 تم العثور على الرقم <span style="color:#10b981">${target}</span> عند الفهرس [${mid}] خلال <span style="color:#38bdf8">${stepsCount}</span> خطوة!`;
            } else if (array[mid] < target) {
                statusEl.innerHTML = `↗️ العنصر في المنتصف [${mid}] قيمته (${array[mid]}) أصغر من المطلوب (${target}). ننتقل إلى النصف الأيمن.`;
                left = mid + 1;
            } else {
                statusEl.innerHTML = `↙️ العنصر في المنتصف [${mid}] قيمته (${array[mid]}) أكبر من المطلوب (${target}). ننتقل إلى النصف الأيسر.`;
                right = mid - 1;
            }

            renderArray();
        }

        // التشغيل الأول وتوليد المصفوفة تلقائياً
        generateRandomArray();
    </script>

</body>

</html>
