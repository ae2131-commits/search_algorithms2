<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Linear Search Visualizer - With Steps Counter</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 900px;
            width: 100%;
        }

        h2 {
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .input-section {
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            width: 120px;
            text-align: center;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 15px;
            font-size: 16px;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
        }

        .stats-bar span {
            color: #38bdf8;
            font-weight: bold;
        }

        .array-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
            background: #0f172a;
            border-radius: 10px;
        }

        .cell {
            width: 50px;
            height: 50px;
            background: #334155;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .cell span.index {
            font-size: 9px;
            color: #94a3b8;
            margin-top: 2px;
        }

        .cell.current {
            background: #f59e0b;
            color: #000;
            transform: scale(1.1);
            border-color: #fbbf24;
        }

        .cell.checked {
            background: #475569;
            color: #cbd5e1;
            opacity: 0.7;
        }

        .cell.found {
            background: #10b981;
            color: #fff;
            transform: scale(1.15);
            border-color: #34d399;
        }

        .controls {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #475569;
            color: white;
        }

        .btn-secondary:hover {
            background: #334155;
        }

        .btn-accent {
            background: #10b981;
            color: white;
        }

        .btn-accent:hover {
            background: #059669;
        }

        .status {
            font-size: 18px;
            margin-top: 15px;
            min-height: 30px;
            color: #e2e8f0;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>أداة بحث تفاعلية (Linear Search) - عداد الخطوات</h2>

        <div class="input-section">
            <label for="targetInput">ابحث عن الرقم:</label>
            <input type="number" id="targetInput" value="45">
            <button class="btn-accent" onclick="startNewSearch()">بدء بحث جديد</button>
            <button class="btn-secondary" onclick="generateRandomArray()">توليد أرقام جديدة 🎲</button>
        </div>

        <div class="stats-bar">
            <div>عدد الخطوات (Steps): <span id="steps-count">0</span></div>
            <div>حجم المصفوفة: <span id="array-size">0</span></div>
        </div>

        <div class="array-container" id="array-box"></div>

        <div class="controls">
            <button class="btn-secondary" onclick="resetSearch()">إعادة تعيين</button>
            <button class="btn-primary" onclick="nextStep()">الخطوة التالية ➡️</button>
        </div>

        <div class="status" id="status-text">اختر رقماً واضغط على "بدء بحث جديد"...</div>
    </div>

    <script>
        let array = [];
        let target = 45;
        let currentIndex = -1;
        let stepsCount = 0;
        let searchState = 'idle'; // idle, searching, found, not_found

        function generateRandomArray() {
            array = [];
            for (let i = 0; i < 14; i++) {
                array.push(Math.floor(Math.random() * 90) + 10);
            }
            document.getElementById('array-size').innerText = array.length;
            resetSearch();
        }

        function renderArray() {
            const box = document.getElementById('array-box');
            box.innerHTML = '';
            array.forEach((val, idx) => {
                let className = 'cell';
                if (idx === currentIndex) {
                    if (searchState === 'found' && val === target) {
                        className += ' found';
                    } else {
                        className += ' current';
                    }
                } else if (idx < currentIndex || (searchState === 'not_found' && idx <= currentIndex)) {
                    className += ' checked';
                }

                box.innerHTML += `
                <div class="${className}">
                    ${val}
                    <span class="index">[${idx}]</span>
                </div>
            `;
            });
            document.getElementById('steps-count').innerText = stepsCount;
        }

        function startNewSearch() {
            const inputVal = document.getElementById('targetInput').value;
            if (inputVal === '') {
                alert('الرجاء إدخال رقم للبحث عنه!');
                return;
            }
            target = parseInt(inputVal);
            currentIndex = -1;
            stepsCount = 0;
            searchState = 'searching';
            renderArray();
            document.getElementById('status-text').innerHTML = `جاهز للبحث عن الرقم <span style="color:#38bdf8">${target}</span>. اضغط "الخطوة التالية"`;
        }

        function resetSearch() {
            currentIndex = -1;
            stepsCount = 0;
            searchState = 'idle';
            renderArray();
            document.getElementById('status-text').innerText = `تم إعادة تعيين البحث.`;
        }

        function nextStep() {
            const statusEl = document.getElementById('status-text');

            if (searchState === 'idle') {
                startNewSearch();
                return;
            }

            if (searchState === 'found' || searchState === 'not_found') {
                return;
            }

            if (currentIndex === -1) {
                currentIndex = 0;
                stepsCount = 1;
            } else {
                if (array[currentIndex] === target) {
                    searchState = 'found';
                    statusEl.innerHTML = `🎉 تم العثور على الرقم <span style="color:#10b981">${target}</span> عند الفهرس [${currentIndex}] خلال <span style="color:#38bdf8">${stepsCount}</span> خطوة!`;
                    renderArray();
                    return;
                }
                currentIndex++;
                stepsCount++;

                if (currentIndex >= array.length) {
                    searchState = 'not_found';
                    // عدد الخطوات الفعلي يساوي طول المصفوفة في حالة عدم العثور عليها
                    stepsCount = array.length;
                    statusEl.innerHTML = `❌ انتهت المصفوفة. الرقم <span style="color:#ef4444">${target}</span> غير موجود بعد فحص جميع العناصر في <span style="color:#38bdf8">${stepsCount}</span> خطوات!`;
                    currentIndex = array.length - 1;
                    renderArray();
                    return;
                }
            }

            if (searchState === 'searching') {
                if (array[currentIndex] === target) {
                    searchState = 'found';
                    statusEl.innerHTML = `🎉 تم العثور على الرقم <span style="color:#10b981">${target}</span> عند الفهرس [${currentIndex}] خلال <span style="color:#38bdf8">${stepsCount}</span> خطوة!`;
                } else {
                    statusEl.innerHTML = `🔍 فحص العنصر <span style="color:#f59e0b">${array[currentIndex]}</span> عند الفهرس [${currentIndex}] (الخطوة رقم ${stepsCount})`;
                }
            }
            renderArray();
        }

        // التشغيل الأول
        generateRandomArray();
    </script>

</body>

</html>
